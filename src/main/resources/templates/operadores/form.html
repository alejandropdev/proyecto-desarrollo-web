<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${operador.id != null} ? 'Editar operador' : 'Nuevo operador'">Formulario operador — MUK.</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen flex flex-col">
  <div th:replace="~{fragments/layout :: navbar-site}"></div>

  <main class="flex-1 container mx-auto px-4 py-8 max-w-2xl">
    <h1 class="text-3xl font-bold text-amber-900 mb-6" th:text="${operador.id != null} ? 'Editar operador' : 'Nuevo operador'">Formulario</h1>

    <form th:action="@{/operadores}" th:object="${operador}" method="post" class="space-y-4">
      <input type="hidden" th:field="*{id}">
      <div>
        <label for="nombre" class="block text-sm font-medium text-stone-700 mb-1">Nombre</label>
        <input type="text" id="nombre" th:field="*{nombre}" required
               class="w-full border border-stone-300 rounded px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
      </div>
      <div>
        <label for="usuario" class="block text-sm font-medium text-stone-700 mb-1">Usuario</label>
        <input type="text" id="usuario" th:field="*{usuario}" required
               class="w-full border border-stone-300 rounded px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
      </div>
      <div>
        <label for="contrasenaHash" class="block text-sm font-medium text-stone-700 mb-1">Contraseña <span th:if="${operador.id == null}" class="text-red-500">*</span></label>
        <input type="password" id="contrasenaHash" th:field="*{contrasenaHash}" 
               th:required="${operador.id == null}"
               class="w-full border border-stone-300 rounded px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
        <p class="text-xs text-stone-500 mt-1" th:if="${operador.id != null}">Dejar vacío si no quieres cambiar la contraseña</p>
      </div>
      <div class="flex gap-3 pt-4">
        <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white font-medium px-6 py-2 rounded">Guardar</button>
        <a th:href="@{/operadores}" class="bg-stone-200 hover:bg-stone-300 text-stone-800 font-medium px-6 py-2 rounded">Cancelar</a>
      </div>
    </form>
  </main>

  <div th:replace="~{fragments/layout :: footer-site}"></div>
</body>
</html>
