<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${operador.nombre} + ' — MUK.'">Detalle — MUK.</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen flex flex-col">
  <div th:replace="~{fragments/layout :: navbar-site}"></div>

  <main class="flex-1 container mx-auto px-4 py-8">
    <a th:href="@{/operadores}" class="text-amber-700 hover:underline mb-4 inline-block">← Volver a operadores</a>
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow p-8">
      <h1 class="text-3xl font-bold text-amber-900 mb-6" th:text="${operador.nombre}"></h1>

      <div class="space-y-4">
        <div class="flex justify-between border-b pb-3">
          <span class="font-medium text-stone-700">ID:</span>
          <span th:text="${operador.id}" class="text-stone-600"></span>
        </div>

        <div class="flex justify-between border-b pb-3">
          <span class="font-medium text-stone-700">Usuario:</span>
          <span th:text="${operador.usuario}" class="text-stone-600"></span>
        </div>
      </div>

      <div class="flex gap-3 mt-8 pt-6 border-t">
        <a th:href="@{/operadores/edit/{id}(id=${operador.id})}" class="bg-amber-600 hover:bg-amber-700 text-white font-medium px-4 py-2 rounded">Editar</a>
        <a th:href="@{/operadores}" class="bg-stone-200 hover:bg-stone-300 text-stone-800 font-medium px-4 py-2 rounded">Volver</a>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/layout :: footer-site}"></div>
</body>
</html>
