<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva categoría — MUK.</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen flex flex-col">
  <div th:replace="~{fragments/layout :: navbar}"></div>

  <main class="flex-1 container mx-auto px-4 py-8 max-w-2xl">
    <h1 class="text-3xl font-bold text-amber-900 mb-6">Nueva categoría</h1>

    <p th:if="${error}" th:text="${error}" class="mb-4 p-3 bg-red-100 text-red-800 rounded"></p>

    <form th:action="@{/categorias}" method="post" class="space-y-4">
      <div>
        <label for="name" class="block text-sm font-medium text-stone-700 mb-1">Nombre</label>
        <input type="text" id="name" name="name" required
               class="w-full border border-stone-300 rounded px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
      </div>
      <div class="flex gap-3 pt-4">
        <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white font-medium px-6 py-2 rounded">Guardar</button>
        <a th:href="@{/categorias}" class="bg-stone-200 hover:bg-stone-300 text-stone-800 font-medium px-6 py-2 rounded">Cancelar</a>
      </div>
    </form>
  </main>

  <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
