<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${producto.nombre} + ' — MUK.'">Detalle — MUK.</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen flex flex-col">
  <div th:replace="~{fragments/layout :: navbar}"></div>

  <main class="flex-1 container mx-auto px-4 py-8">
    <a th:href="@{/productos}" class="text-amber-700 hover:underline mb-4 inline-block">← Volver a productos</a>
    <div class="max-w-4xl mx-auto flex flex-col md:flex-row gap-8">
      <div class="flex-shrink-0">
        <img th:src="${producto.imagenUrl}" th:alt="${producto.nombre}" class="w-full max-w-md rounded-lg shadow-lg object-cover">
      </div>
      <div class="flex-1">
        <span th:text="${producto.categoria != null ? producto.categoria.nombre : ''}" class="inline-block bg-amber-100 text-amber-800 text-sm font-medium px-2 py-1 rounded mb-2"></span>
        <h1 class="text-3xl font-bold text-amber-900 mb-2" th:text="${producto.name}">Nombre</h1>
        <p class="text-stone-600 mb-4" th:text="${producto.description}">Descripción</p>
        <p class="text-xl font-semibold text-amber-900 mb-2">$<span th:text="${producto.price != null ? #numbers.formatInteger(producto.price, 0, 'POINT') : '0'}"></span> COP</p>
        <p class="text-sm text-stone-500 mb-6">
          <span th:if="${producto.available != null && producto.available}">Disponible</span>
          <span th:unless="${producto.available != null && producto.available}">No disponible</span>
        </p>
        <div class="flex gap-3">
          <a th:href="@{/productos/edit/{id}(id=${producto.id})}" class="bg-amber-600 hover:bg-amber-700 text-white font-medium px-4 py-2 rounded">Editar</a>
          <a th:href="@{/productos}" class="bg-stone-200 hover:bg-stone-300 text-stone-800 font-medium px-4 py-2 rounded">Volver</a>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
