<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muk. | Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    style="
      font-family:
        Inter,
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        Arial,
        sans-serif;
      background-color: #faf7f0;
    "
  >
    <div th:replace="fragments/layout :: navbar-site"></div>

    <main
      class="pt-16 md:pt-20 min-h-screen flex items-center justify-center px-4 sm:px-8 py-14"
      style="background-color: #faf7f0"
    >
      <div
        class="w-full max-w-md rounded-3xl shadow-2xl p-8 sm:p-10"
        style="background-color: white"
      >
        <h1
          class="text-3xl sm:text-4xl font-black uppercase tracking-tighter text-center"
          style="color: #34100b"
        >
          Iniciar sesión
        </h1>
        <p
          class="text-center font-bold mt-2"
          style="color: #8c0e03; opacity: 0.8"
        >
          Vuelve por tu próximo reto.
        </p>

        <form
          class="mt-8 space-y-5"
          method="post"
          th:action="@{/clientes/login}"
        >
          <div>
            <label
              class="block text-xs font-black uppercase tracking-widest mb-2"
              style="color: #8c0e03"
              >Correo</label
            >
            <input
              type="email"
              name="email"
              placeholder="tucorreo@ejemplo.com"
              class="w-full px-5 py-4 rounded-2xl font-bold border-4 focus:outline-none"
              style="border-color: #f2b705"
              required
            />
          </div>
          <div>
            <label
              class="block text-xs font-black uppercase tracking-widest mb-2"
              style="color: #8c0e03"
              >Contraseña</label
            >
            <input
              type="password"
              name="password"
              placeholder="••••••••"
              class="w-full px-5 py-4 rounded-2xl font-bold border-4 focus:outline-none"
              style="border-color: #f2b705"
              required
            />
          </div>

          <button
            type="submit"
            class="w-full py-4 font-black rounded-full uppercase tracking-widest text-white shadow-xl transition-all hover:brightness-110"
            style="background-color: #d93d04"
          >
            Entrar
          </button>

          <div
            class="text-center text-sm font-bold"
            style="color: #34100b; opacity: 0.8"
          >
            ¿No tienes cuenta?
            <a
              th:href="@{/clientes/registro}"
              class="font-black underline"
              style="color: #f27405"
              >Crear cuenta</a
            >
          </div>

          <div
            th:if="${error}"
            class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mt-4"
          >
            <p th:text="${error}"></p>
          </div>
          <div
            th:if="${message}"
            class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 mt-4"
          >
            <p th:text="${message}"></p>
          </div>
        </form>
      </div>
    </main>

    <div th:replace="fragments/layout :: footer-site"></div>

    <script th:src="@{/script.js}" src="/script.js"></script>
  </body>
</html>
