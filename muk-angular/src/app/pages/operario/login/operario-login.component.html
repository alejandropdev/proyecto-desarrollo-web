<div class="login-container">
  <h2>Login Operario</h2>

  <input
    type="text"
    placeholder="Usuario"
    [(ngModel)]="usuario"
  />

  <input
    type="password"
    placeholder="Contraseña"
    [(ngModel)]="password"
  />

<button type="button" (click)="onSubmit()">
  Ingresar
</button>

  <p class="error" *ngIf="error">{{ error }}</p>
</div>
