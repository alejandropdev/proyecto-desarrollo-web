<main class="pt-20 min-h-screen flex items-center justify-center px-4 sm:px-8 py-14" style="background-color:#faf7f0">
  <div class="w-full max-w-md rounded-3xl shadow-2xl p-8 sm:p-10" style="background-color:white">
    <h1 class="text-3xl sm:text-4xl font-black uppercase tracking-tighter text-center" style="color:#34100b">Operario Login</h1>
    <form class="mt-8 space-y-5" (ngSubmit)="onSubmit()">
      <input type="text" name="usuario" [(ngModel)]="usuario" placeholder="Usuario" class="w-full px-5 py-4 rounded-2xl font-bold border-4 focus:outline-none" style="border-color:#f2b705" required />
      <input type="password" name="password" [(ngModel)]="password" placeholder="Contraseña" class="w-full px-5 py-4 rounded-2xl font-bold border-4 focus:outline-none" style="border-color:#f2b705" required />
      <button type="submit" class="w-full py-4 font-black rounded-full uppercase tracking-widest text-white shadow-xl" style="background-color:#d93d04">Entrar</button>
      <div *ngIf="error" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mt-4"><p>{{ error }}</p></div>
    </form>
  </div>
</main>
