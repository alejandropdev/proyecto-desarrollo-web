<main class="pt-24 pb-16 min-h-screen" style="background-color: #faf7f0">
  <div class="max-w-7xl mx-auto px-4">
    
    <div class="mb-10">
      <div class="flex items-center justify-between gap-4">
        <h1 class="text-4xl font-black uppercase" style="color: #34100b">Portal de Operario</h1>
        <button
          type="button"
          (click)="cerrarSesion()"
          class="px-5 py-2 rounded-full font-black text-white uppercase text-xs"
          style="background-color: #8c0e03"
        >
          Cerrar sesión
        </button>
      </div>
    </div>

    <div class="rounded-2xl shadow-xl bg-white overflow-hidden border-2" style="border-color: #f2b705">
      <table class="w-full text-left">
        <thead>
          <tr style="background-color: #34100b; color: white">
            <th class="p-4 uppercase font-black">ID</th>
            <th class="p-4 uppercase font-black">Cliente</th>
            <th class="p-4 uppercase font-black">Estado</th>
            <th class="p-4 uppercase font-black text-center">Acción</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of pedidos" class="border-b">
            <td class="p-4 font-bold">#{{ p.id }}</td>
            <td class="p-4 font-semibold">{{ getNombreCliente(p) }}</td>
            <td class="p-4">
              <span [ngStyle]="{'background-color': getEstadoColor(p.estado)}" 
                    class="px-3 py-1 rounded-full text-white text-xs font-black uppercase">
                {{ p.estado }}
              </span>
            </td>
            <td class="p-4 text-center">
              <button (click)="verDetalle(p.id)" 
                      class="px-4 py-2 rounded-full font-black text-white uppercase text-xs"
                      style="background-color: #8c0e03">
                Ver Detalle
              </button>
            </td>
          </tr>
        </tbody>
      </table>
      
      <div *ngIf="isLoading" class="p-10 text-center font-bold uppercase">
        Cargando pedidos...
      </div>
    </div>
  </div>
</main>
