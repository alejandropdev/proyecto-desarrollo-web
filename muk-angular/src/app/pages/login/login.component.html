<main class="pt-16 md:pt-20 min-h-screen flex items-center justify-center px-4 sm:px-8 py-14" style="background-color: #faf7f0">
  <div class="w-full max-w-md rounded-3xl shadow-2xl p-8 sm:p-10" style="background-color: white">
    <h1 class="text-3xl sm:text-4xl font-black uppercase tracking-tighter text-center" style="color: #34100b">Iniciar sesión</h1>
    <p class="text-center font-bold mt-2" style="color: #8c0e03; opacity: 0.8">Vuelve por tu próximo reto.</p>

    <form class="mt-8 space-y-5" (ngSubmit)="onSubmit()">
      <div>
        <label class="block text-xs font-black uppercase tracking-widest mb-2" style="color: #8c0e03">Correo</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="tucorreo@ejemplo.com" class="w-full px-5 py-4 rounded-2xl font-bold border-4 focus:outline-none" style="border-color: #f2b705" required />
      </div>
      <div>
        <label class="block text-xs font-black uppercase tracking-widest mb-2" style="color: #8c0e03">Contraseña</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" class="w-full px-5 py-4 rounded-2xl font-bold border-4 focus:outline-none" style="border-color: #f2b705" required />
      </div>
      <button type="submit" class="w-full py-4 font-black rounded-full uppercase tracking-widest text-white shadow-xl transition-all hover:brightness-110" style="background-color: #d93d04">
        Entrar
      </button>
      <div class="text-center text-sm font-bold" style="color: #34100b; opacity: 0.8">
        ¿No tienes cuenta?
        <a routerLink="/registro" class="font-black underline" style="color: #f27405">Crear cuenta</a>
      </div>
      <div *ngIf="error" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mt-4">
        <p>{{ error }}</p>
      </div>
    </form>
  </div>
</main>
