<main class="pt-20 md:pt-24 min-h-screen px-4 sm:px-8 lg:px-16 py-12 sm:py-16" style="background-color:#faf7f0">
  <div class="max-w-6xl mx-auto" *ngIf="plato">
    <a routerLink="/admin/platos" class="inline-flex items-center gap-2 font-black uppercase tracking-widest text-sm mb-6" style="color:#8c0e03">
      <span>←</span><span>Volver al listado</span>
    </a>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-14">
      <div class="rounded-3xl overflow-hidden shadow-2xl" style="background-color:#f2b705">
        <div class="relative h-80 sm:h-[420px] lg:h-[520px]">
          <img [src]="plato.imagenUrl" [alt]="plato.nombre" class="w-full h-full object-cover" />
          <div class="absolute top-6 left-6" *ngIf="plato.categoria?.nombre">
            <span class="px-4 py-2 text-xs font-black rounded-full text-white uppercase tracking-widest" style="background-color:#8c0e03">
              {{ plato.categoria?.nombre }}
            </span>
          </div>
        </div>
      </div>

      <div class="flex flex-col justify-center">
        <h1 class="text-4xl sm:text-5xl lg:text-6xl font-black uppercase tracking-tighter leading-[0.95]" style="color:#34100b">
          {{ plato.nombre }}
        </h1>
        <p class="mt-4 text-xl sm:text-2xl font-black italic" style="color:#8c0e03">${{ plato.precio }} COP</p>
        <p class="mt-6 text-base sm:text-lg font-bold leading-relaxed" style="color:#34100b;opacity:0.85">{{ plato.descripcion }}</p>

        <div class="mt-8 flex flex-col sm:flex-row gap-4">
          <a [routerLink]="['/admin/platos', plato.id, 'editar']" class="w-full sm:w-auto">
            <button class="w-full px-10 py-4 font-black rounded-full uppercase tracking-widest transition-all hover:scale-105 active:scale-95 text-white shadow-xl" style="background-color:#d93d04">
              Editar plato
            </button>
          </a>
          <button type="button" (click)="onDelete()" class="w-full sm:w-auto px-10 py-4 border-2 font-black rounded-full uppercase tracking-widest transition-all hover:bg-black/5 active:scale-95" style="border-color:#f27405;color:#f27405">
            Eliminar plato
          </button>
        </div>

        <div class="mt-6">
          <a routerLink="/menu" class="w-full sm:w-auto inline-block">
            <span class="w-full sm:w-auto px-10 py-4 font-black rounded-full uppercase tracking-widest text-white inline-block" style="background-color:#34100b;text-align:center;">
              Ver en el sitio
            </span>
          </a>
        </div>

        <div class="mt-10 grid grid-cols-2 gap-4">
          <div class="rounded-2xl p-5 shadow-lg" style="background-color:white">
            <div class="text-xs font-black uppercase tracking-widest" style="color:#8c0e03">Admin</div>
            <div class="mt-2 font-bold" style="color:#34100b">Puedes editar informacion o imagen de este plato.</div>
          </div>
          <div class="rounded-2xl p-5 shadow-lg" style="background-color:white">
            <div class="text-xs font-black uppercase tracking-widest" style="color:#8c0e03">Estado</div>
            <div class="mt-2 font-bold" style="color:#34100b">ID del plato: {{ plato.id }}</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
