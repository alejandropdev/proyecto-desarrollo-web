<main class="pt-20 md:pt-24 min-h-screen px-4 sm:px-8 lg:px-16 py-12 sm:py-16" style="background-color:#faf7f0">
  <div class="max-w-6xl mx-auto" *ngIf="adicion">
    <a routerLink="/admin/adiciones" class="inline-flex items-center gap-2 font-black uppercase tracking-widest text-sm mb-6" style="color:#8c0e03">
      <span>←</span><span>Volver al listado</span>
    </a>

    <div class="rounded-3xl shadow-2xl p-8 sm:p-10" style="background-color:white">
      <h1 class="text-4xl sm:text-5xl font-black uppercase tracking-tighter leading-[0.95]" style="color:#34100b">
        {{ adicion.nombre }}
      </h1>
      <p class="mt-4 text-xl sm:text-2xl font-black italic" style="color:#8c0e03">${{ adicion.precio }} COP</p>

      <div class="mt-8 flex flex-col sm:flex-row gap-4">
        <a [routerLink]="['/admin/adiciones', adicion.id, 'editar']" class="w-full sm:w-auto">
          <button class="w-full px-10 py-4 font-black rounded-full uppercase tracking-widest transition-all hover:scale-105 active:scale-95 text-white shadow-xl" style="background-color:#d93d04">
            Editar adicion
          </button>
        </a>
        <button type="button" (click)="onDelete()" class="w-full sm:w-auto px-10 py-4 border-2 font-black rounded-full uppercase tracking-widest transition-all hover:bg-black/5 active:scale-95" style="border-color:#f27405;color:#f27405">
          Eliminar adicion
        </button>
      </div>

      <div class="mt-10 grid grid-cols-2 gap-4">
        <div class="rounded-2xl p-5 shadow-lg" style="background-color:#faf7f0">
          <div class="text-xs font-black uppercase tracking-widest" style="color:#8c0e03">Estado</div>
          <div class="mt-2 font-bold" style="color:#34100b">ID de la adicion: {{ adicion.id }}</div>
        </div>
      </div>
    </div>
  </div>
</main>
