<div class="pedido-card">
  <!-- Estado badge -->
  <div class="estado-badge" [style.background-color]="getEstadoColor()">
    <span class="emoji">{{ getEstadoEmoji() }}</span>
    <span class="estado-texto">{{ pedido.estado }}</span>
  </div>

  <!-- Información del pedido -->
  <div class="pedido-info">
    <div class="info-row">
      <span class="label">Pedido #</span>
      <span class="value">{{ pedido.id }}</span>
    </div>
    <div class="info-row">
      <span class="label">Cliente ID</span>
      <span class="value">{{ pedido.clienteId }}</span>
    </div>
    <div class="info-row">
      <span class="label">Productos</span>
      <span class="value">{{ pedido.cantidadProductos }}</span>
    </div>
    <div class="info-row">
      <span class="label">Adiciones</span>
      <span class="value">{{ pedido.cantidadAdiciones }}</span>
    </div>
    <div class="info-row">
      <span class="label">Creado</span>
      <span class="value">{{ formatearFecha(pedido.fechaCreacion) }}</span>
    </div>
    <div *ngIf="pedido.fechaEntrega" class="info-row">
      <span class="label">Entregado</span>
      <span class="value">{{ formatearFecha(pedido.fechaEntrega) }}</span>
    </div>
  </div>

  <!-- Cambiar estado -->
  <div class="cambiar-estado">
    <label for="new-state-{{ pedido.id }}" class="estado-label">Nuevo Estado:</label>
    <div class="estado-select-container">
      <select
        #selectElement
        id="new-state-{{ pedido.id }}"
        class="estado-select"
        (change)="onCambiarEstado(selectElement.value)"
      >
        <option value="" disabled selected>Selecciona nuevo estado</option>
        <option *ngFor="let estado of estadosDisponibles" [value]="estado">
          {{ estado }}
        </option>
      </select>
    </div>
  </div>
</div>
