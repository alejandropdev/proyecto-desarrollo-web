<div *ngIf="mostrar" class="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <h2>Cambiar Estado del Pedido</h2>
      <button (click)="onCancelar()" class="close-btn">&times;</button>
    </div>

    <div class="modal-body">
      <div class="info">
        <p><strong>Pedido:</strong> #{{ pedidoId }}</p>
        <p><strong>Estado Actual:</strong> <span class="estado-actual">{{ estadoActual }}</span></p>
      </div>

      <!-- Mensaje de error -->
      <div *ngIf="mensajeError" class="alert alert-error">
        {{ mensajeError }}
      </div>

      <!-- Seleccionar nuevo estado -->
      <div class="form-group">
        <label for="nuevo-estado">Selecciona el nuevo estado:</label>
        <select
          id="nuevo-estado"
          [(ngModel)]="nuevoEstado"
          class="form-control"
        >
          <option *ngFor="let estado of estadosDisponibles" [value]="estado">
            {{ getEstadoEmoji(estado) }} {{ estado }}
          </option>
        </select>
      </div>

      <!-- Preview del nuevo estado -->
      <div *ngIf="nuevoEstado" class="preview">
        <p>Nuevo estado:</p>
        <span class="estado-preview">{{ getEstadoEmoji(nuevoEstado) }} {{ nuevoEstado }}</span>
      </div>
    </div>

    <div class="modal-footer">
      <button (click)="onCancelar()" class="btn btn-secondary">
        Cancelar
      </button>
      <button (click)="onConfirmar()" class="btn btn-primary">
        Confirmar Cambio
      </button>
    </div>
  </div>
</div>
