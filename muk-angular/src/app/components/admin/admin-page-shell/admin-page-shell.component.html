<main class="pt-20 md:pt-24 min-h-screen px-4 sm:px-8 lg:px-16 py-12" style="background-color:#faf7f0">
  <div class="max-w-7xl mx-auto">
    <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-6 mb-10">
      <div>
        <h1 class="text-3xl sm:text-4xl font-black uppercase tracking-tighter" style="color:#34100b">{{ title }}</h1>
        <p class="font-bold mt-2" style="color:#8c0e03;opacity:0.8">{{ subtitle }}</p>
      </div>
      <a *ngIf="actionLabel && actionLink" [routerLink]="actionLink">
        <button class="px-8 py-4 font-black rounded-full uppercase tracking-widest text-white shadow-xl transition-all hover:brightness-110" style="background-color:#f27405">
          {{ actionLabel }}
        </button>
      </a>
    </div>
    <ng-content></ng-content>
  </div>
</main>
