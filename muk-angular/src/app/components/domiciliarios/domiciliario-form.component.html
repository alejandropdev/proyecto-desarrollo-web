<div class="formulario-container">
  <div class="formulario-overlay" (click)="onCancelar()"></div>
  
  <form class="formulario" (ngSubmit)="onSubmit()">
    <div class="formulario-header">
      <h2>{{ editando ? 'Editar Domiciliario' : 'Nuevo Domiciliario' }}</h2>
      <button type="button" (click)="onCancelar()" class="close-btn">&times;</button>
    </div>

    <div class="formulario-body">
      <!-- Nombre -->
      <div class="form-group" [class.has-error]="tieneError('nombre')">
        <label for="nombre">Nombre *</label>
        <input
          id="nombre"
          type="text"
          [(ngModel)]="nombre"
          (input)="onInputChange()"
          name="nombre"
          placeholder="Ej: Juan Pérez"
          class="form-control"
          [class.error]="tieneError('nombre')"
        />
        <span *ngIf="tieneError('nombre')" class="error-message">
          {{ getMensajeError('nombre') }}
        </span>
      </div>

      <!-- Celular -->
      <div class="form-group" [class.has-error]="tieneError('celular')">
        <label for="celular">Celular *</label>
        <input
          id="celular"
          type="tel"
          [(ngModel)]="celular"
          (input)="onInputChange()"
          name="celular"
          placeholder="Ej: 3001234567"
          class="form-control"
          [class.error]="tieneError('celular')"
        />
        <span *ngIf="tieneError('celular')" class="error-message">
          {{ getMensajeError('celular') }}
        </span>
      </div>

      <!-- Cédula -->
      <div class="form-group" [class.has-error]="tieneError('cedula')">
        <label for="cedula">Cédula *</label>
        <input
          id="cedula"
          type="text"
          [(ngModel)]="cedula"
          (input)="onInputChange()"
          name="cedula"
          placeholder="Ej: 12345678"
          class="form-control"
          [class.error]="tieneError('cedula')"
        />
        <span *ngIf="tieneError('cedula')" class="error-message">
          {{ getMensajeError('cedula') }}
        </span>
      </div>

      <small class="nota">* Campos requeridos</small>
    </div>

    <div class="formulario-footer">
      <button type="button" (click)="onCancelar()" class="btn btn-secondary" [disabled]="enviando">
        Cancelar
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="!formularioValido || enviando">
        {{ enviando ? 'Guardando...' : (editando ? 'Actualizar' : 'Crear') }}
      </button>
    </div>
  </form>
</div>
