<header
  id="navbar"
  class="fixed top-0 left-0 right-0 z-50 h-20 md:h-24 flex items-center justify-between px-6 sm:px-10 lg:px-20"
  style="background-color: #34100b; border-bottom: 3px solid #8c0e03"
>
  <!-- LOGO -->
  <div class="flex items-center shrink-0">
    <a routerLink="/" class="cursor-pointer hover:opacity-90 transition-all">
      <span
        class="text-4xl sm:text-5xl font-black uppercase tracking-tighter"
        style="color: #f2b705"
      >
        Muk.
      </span>
    </a>
  </div>

  <!-- NAV DESKTOP -->
  <div class="hidden lg:flex items-center gap-16 xl:gap-20 mx-auto">
    <a
      routerLink="/"
      class="font-extrabold uppercase tracking-wide text-xl transition-all"
      style="color: #f2b705"
    >
      Inicio
    </a>

    <a
      routerLink="/menu"
      class="font-extrabold uppercase tracking-wide text-xl transition-all opacity-80 hover:opacity-100"
      style="color: #f2b705"
    >
      Menú
    </a>

    <a
      routerLink="/desafios"
      class="font-extrabold uppercase tracking-wide text-xl transition-all opacity-80 hover:opacity-100"
      style="color: #f2b705"
    >
      Desafíos
    </a>

    <!-- Enlaces de Pedidos (Solo si está autenticado) -->
    <a
      *ngIf="isAuthenticated"
      routerLink="/carrito"
      class="font-extrabold uppercase tracking-wide text-xl transition-all opacity-80 hover:opacity-100 inline-flex items-center gap-2"
      style="color: #f2b705"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="w-5 h-5"
      >
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="20" cy="20" r="1"></circle>
        <path d="M1 1h4l2.68 12.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
      Carrito
    </a>

    <a
      *ngIf="isAuthenticated"
      routerLink="/pedidos/mis-pedidos"
      class="font-extrabold uppercase tracking-wide text-xl transition-all opacity-80 hover:opacity-100"
      style="color: #f2b705"
    >
      Mis Pedidos
    </a>
  </div>

  <!-- BOTONES -->
  <div class="hidden lg:flex items-center gap-4 shrink-0">
    <!-- Si NO está autenticado -->
    <a
      *ngIf="!isAuthenticated"
      routerLink="/login"
      class="px-5 py-3 rounded-xl text-lg font-bold border-2 transition-all hover:brightness-110"
      style="border-color: #f2b705; color: #f2b705"
    >
      Iniciar sesión
    </a>

    <a
      *ngIf="!isAuthenticated"
      routerLink="/registro"
      class="px-5 py-3 rounded-xl text-lg font-bold text-white transition-all hover:brightness-110"
      style="background-color: #f27405"
    >
      Crear cuenta
    </a>

    <!-- Si está autenticado -->
    <a
      *ngIf="isAuthenticated"
      routerLink="/clientes/perfil"
      class="px-5 py-3 rounded-xl text-lg font-bold border-2 transition-all hover:brightness-110"
      style="border-color: #f2b705; color: #f2b705"
    >
      {{ clienteEmail }}
    </a>

    <button
      *ngIf="isAuthenticated"
      (click)="logout()"
      class="px-5 py-3 rounded-xl text-lg font-bold text-white transition-all hover:brightness-110"
      style="background-color: #f27405"
    >
      Salir
    </button>
  </div>

  <!-- BOTÓN HAMBURGUESA -->
  <button
    id="nav-toggle"
    type="button"
    class="lg:hidden p-2"
    aria-label="Abrir menú"
    [attr.aria-expanded]="isMobileMenuOpen"
    (click)="toggleMobileMenu()"
  >
    <span class="block w-6 h-0.5 mb-1" style="background-color: #f27405"></span>
    <span class="block w-6 h-0.5 mb-1" style="background-color: #f27405"></span>
    <span class="block w-6 h-0.5" style="background-color: #f27405"></span>
  </button>

  <!-- NAV MOBILE -->
  <div
    id="nav-menu"
    [class]="
      'absolute top-20 left-0 right-0 lg:hidden flex-col gap-6 p-6 shadow-2xl ' +
      (isMobileMenuOpen ? 'flex' : 'hidden')
    "
    style="background-color: #34100b"
  >
    <a
      routerLink="/"
      class="font-bold uppercase tracking-widest text-sm"
      style="color: #f2b705"
      (click)="closeMobileMenu()"
    >
      Inicio
    </a>

    <a
      routerLink="/menu"
      class="font-bold uppercase tracking-widest text-sm"
      style="color: #f2b705"
      (click)="closeMobileMenu()"
    >
      Menú
    </a>

    <a
      routerLink="/desafios"
      class="font-bold uppercase tracking-widest text-sm"
      style="color: #f2b705"
      (click)="closeMobileMenu()"
    >
      Desafíos
    </a>

    <!-- Enlaces de Pedidos Mobile (Solo si está autenticado) -->
    <a
      *ngIf="isAuthenticated"
      routerLink="/carrito"
      class="font-bold uppercase tracking-widest text-sm inline-flex items-center gap-2"
      style="color: #f2b705"
      (click)="closeMobileMenu()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="w-4 h-4"
      >
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="20" cy="20" r="1"></circle>
        <path d="M1 1h4l2.68 12.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
      Carrito
    </a>

    <a
      *ngIf="isAuthenticated"
      routerLink="/pedidos/mis-pedidos"
      class="font-bold uppercase tracking-widest text-sm"
      style="color: #f2b705"
      (click)="closeMobileMenu()"
    >
      Mis Pedidos
    </a>

    <div class="flex flex-col gap-3 mt-4">
      <!-- Si NO está autenticado -->
      <a
        *ngIf="!isAuthenticated"
        routerLink="/login"
        (click)="closeMobileMenu()"
      >
        <button
          class="w-full px-6 py-3 border-2 font-bold rounded-xl transition-all hover:opacity-80"
          style="border-color: #f27405; color: #f27405"
        >
          Iniciar sesión
        </button>
      </a>

      <a
        *ngIf="!isAuthenticated"
        routerLink="/registro"
        (click)="closeMobileMenu()"
      >
        <button
          class="w-full px-6 py-3 font-bold rounded-xl text-white transition-all hover:brightness-110"
          style="background-color: #d93d04"
        >
          Crear cuenta
        </button>
      </a>

      <!-- Si está autenticado -->
      <a
        *ngIf="isAuthenticated"
        routerLink="/clientes/perfil"
        (click)="closeMobileMenu()"
      >
        <button
          class="w-full px-6 py-3 border-2 font-bold rounded-xl transition-all hover:opacity-80"
          style="border-color: #f27405; color: #f27405"
        >
          Mi Perfil
        </button>
      </a>

      <button
        *ngIf="isAuthenticated"
        (click)="logout()"
        class="w-full px-6 py-3 font-bold rounded-xl text-white transition-all hover:brightness-110"
        style="background-color: #d93d04"
      >
        Salir
      </button>
    </div>
  </div>
</header>
