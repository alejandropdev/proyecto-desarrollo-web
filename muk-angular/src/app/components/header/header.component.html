<header
  id="navbar"
  class="fixed top-0 left-0 right-0 z-50 h-20 md:h-24 flex items-center justify-between px-6 sm:px-10 lg:px-20"
  style="background-color: #34100b; border-bottom: 3px solid #8c0e03"
>
  <!-- LOGO -->
  <div class="flex items-center shrink-0">
    <a
      routerLink="/"
      class="cursor-pointer hover:opacity-90 transition-all"
    >
      <span
        class="text-4xl sm:text-5xl font-black uppercase tracking-tighter"
        style="color: #f2b705"
      >
        Muk.
      </span>
    </a>
  </div>

  <!-- NAV DESKTOP -->
  <div class="hidden lg:flex items-center gap-16 xl:gap-20 mx-auto">
    <a
      routerLink="/"
      class="font-extrabold uppercase tracking-wide text-xl transition-all"
      style="color: #f2b705"
    >
      Inicio
    </a>

    <a
      routerLink="/menu"
      class="font-extrabold uppercase tracking-wide text-xl transition-all opacity-80 hover:opacity-100"
      style="color: #f2b705"
    >
      Menú
    </a>

    <a
      routerLink="/desafios"
      class="font-extrabold uppercase tracking-wide text-xl transition-all opacity-80 hover:opacity-100"
      style="color: #f2b705"
    >
      Desafíos
    </a>
  </div>

  <!-- BOTONES -->
  <div class="hidden lg:flex items-center gap-4 shrink-0">
    <a
      routerLink="/login"
      class="px-5 py-3 rounded-xl text-lg font-bold border-2 transition-all hover:brightness-110"
      style="border-color: #f2b705; color: #f2b705;"
    >
      Iniciar sesión
    </a>

    <a
      routerLink="/registro"
      class="px-5 py-3 rounded-xl text-lg font-bold text-white transition-all hover:brightness-110"
      style="background-color: #f27405;"
    >
      Crear cuenta
    </a>
  </div>

  <!-- BOTÓN HAMBURGUESA -->
  <button
    id="nav-toggle"
    type="button"
    class="lg:hidden p-2"
    aria-label="Abrir menú"
    aria-expanded="false"
  >
    <span class="block w-6 h-0.5 mb-1" style="background-color: #f27405"></span>
    <span class="block w-6 h-0.5 mb-1" style="background-color: #f27405"></span>
    <span class="block w-6 h-0.5" style="background-color: #f27405"></span>
  </button>

  <!-- NAV MOBILE -->
  <div
    id="nav-menu"
    class="hidden absolute top-20 left-0 right-0 lg:hidden flex-col gap-6 p-6 shadow-2xl"
    style="background-color: #34100b"
  >
    <a
      routerLink="/"
      class="font-bold uppercase tracking-widest text-sm"
      style="color: #f2b705"
    >
      Inicio
    </a>

    <a
      routerLink="/menu"
      class="font-bold uppercase tracking-widest text-sm"
      style="color: #f2b705"
    >
      Menú
    </a>

    <a
      routerLink="/desafios"
      class="font-bold uppercase tracking-widest text-sm"
      style="color: #f2b705"
    >
      Desafíos
    </a>

    <div class="flex flex-col gap-3 mt-4">
      <a routerLink="/login">
        <button
          class="w-full px-6 py-3 border-2 font-bold rounded-xl transition-all hover:opacity-80"
          style="border-color: #f27405; color: #f27405"
        >
          Iniciar sesión
        </button>
      </a>

      <a routerLink="/registro">
        <button
          class="w-full px-6 py-3 font-bold rounded-xl text-white transition-all hover:brightness-110"
          style="background-color: #d93d04"
        >
          Crear cuenta
        </button>
      </a>
    </div>
  </div>
</header>
