<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta — MUK. Restaurante</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/styles.css}" href="/styles.css">
  <link rel="stylesheet" th:href="@{/src/css/auth.css}" href="/src/css/auth.css">
</head>
<body class="page-auth">
  <div th:replace="~{fragments/layout :: navbar-site}"></div>

  <main>
    <div class="auth-wrap">
      <div class="auth-brand">
        <span class="auth-logo">MUK.</span>
        <p class="auth-subtitle">Crea tu cuenta</p>
      </div>
      <form action="#" method="post">
        <label for="name">Nombre completo</label>
        <input type="text" id="name" name="name" required placeholder="Tu nombre">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required placeholder="tu@email.com">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>
        <button type="submit" class="btn btn-orange">Crear cuenta</button>
      </form>
      <p>¿Ya tienes cuenta? <a th:href="@{/login}" href="/login">Iniciar sesión</a></p>
    </div>
  </main>

  <div th:replace="~{fragments/layout :: footer-site}"></div>
  <script th:src="@{/script.js}" src="/script.js"></script>
</body>
</html>
