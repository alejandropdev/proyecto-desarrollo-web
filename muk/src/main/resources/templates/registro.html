<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muk. | Registro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background-color:#FAF7F0;">

<div th:replace="fragments/layout :: navbar-site"></div>

<main class="pt-16 md:pt-20 min-h-screen flex items-center justify-center px-4 sm:px-8 py-14" style="background-color:#FAF7F0">
  <div class="w-full max-w-md rounded-3xl shadow-2xl p-8 sm:p-10" style="background-color:white">
    <h1 class="text-3xl sm:text-4xl font-black uppercase tracking-tighter text-center" style="color:#34100B">Crear cuenta</h1>
    <p class="text-center font-bold mt-2" style="color:#8C0E03;opacity:0.8">Únete al salón de la fama de Muk.</p>

    <form class="mt-8 space-y-5" method="post" action="#">
      <div>
        <label class="block text-xs font-black uppercase tracking-widest mb-2" style="color:#8C0E03">Nombre</label>
        <input type="text" placeholder="Tu nombre" class="w-full px-5 py-4 rounded-2xl font-bold border-4 focus:outline-none" style="border-color:#F2B705" />
      </div>
      <div>
        <label class="block text-xs font-black uppercase tracking-widest mb-2" style="color:#8C0E03">Correo</label>
        <input type="email" placeholder="tucorreo@ejemplo.com" class="w-full px-5 py-4 rounded-2xl font-bold border-4 focus:outline-none" style="border-color:#F2B705" />
      </div>
      <div>
        <label class="block text-xs font-black uppercase tracking-widest mb-2" style="color:#8C0E03">Contraseña</label>
        <input type="password" placeholder="••••••••" class="w-full px-5 py-4 rounded-2xl font-bold border-4 focus:outline-none" style="border-color:#F2B705" />
      </div>

      <button type="submit" class="w-full py-4 font-black rounded-full uppercase tracking-widest text-white shadow-xl transition-all hover:brightness-110" style="background-color:#F27405">Crear cuenta</button>

      <div class="text-center text-sm font-bold" style="color:#34100B;opacity:0.8">
        ¿Ya tienes cuenta?
        <a th:href="@{/login}" class="font-black underline" style="color:#D93D04">Iniciar sesión</a>
      </div>
    </form>
  </div>
</main>

<div th:replace="fragments/layout :: footer-site"></div>

<script th:src="@{/script.js}" src="/script.js"></script>
</body>
</html>
