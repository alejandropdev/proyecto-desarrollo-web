<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${producto.name} + ' — MUK. Restaurante'">Detalle — MUK. Restaurante</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/styles.css}" href="/styles.css">
  <link rel="stylesheet" th:href="@{/src/css/comida.css}" href="/src/css/comida.css">
</head>
<body class="page-comida">
  <div th:replace="~{fragments/layout :: navbar-site}"></div>

  <main>
    <div class="comida-content">
      <p class="comida-back"><a th:href="@{/menu}" href="/menu">← Volver al menú</a></p>
      <div class="comida-detalle-grid">
        <div class="comida-detalle-img-wrap">
          <img class="comida-detalle-img" th:src="${producto.imageUrl}" th:alt="${producto.name}">
        </div>
        <div class="comida-detalle-info">
          <span class="menu-card-badge" th:text="${producto.category}">Category</span>
          <h1 class="comida-detalle-name" th:text="${producto.name}">Name</h1>
          <p class="comida-detalle-desc" th:text="${producto.description}">Description</p>
          <p class="comida-detalle-price">$<span th:text="${producto.price != null ? #numbers.formatInteger(producto.price, 0, 'POINT') : '0'}">0</span> COP</p>
          <p class="comida-detalle-available"><span th:if="${producto.available != null && producto.available}">Disponible</span><span th:unless="${producto.available != null && producto.available}">No disponible</span></p>
          <a th:href="@{/menu}" href="/menu" class="btn btn-orange">Volver al menú</a>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/layout :: footer-site}"></div>
  <script th:src="@{/script.js}" src="/script.js"></script>
</body>
</html>
