<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorías — MUK.</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen flex flex-col">
  <div th:replace="~{fragments/layout :: navbar}"></div>

  <main class="flex-1 container mx-auto px-4 py-8 max-w-3xl">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-3xl font-bold text-amber-900">Categorías</h1>
      <a th:href="@{/categorias/new}" class="bg-amber-600 hover:bg-amber-700 text-white font-medium px-4 py-2 rounded">Nueva categoría</a>
    </div>

    <p th:if="${message}" th:text="${message}" class="mb-4 p-3 bg-green-100 text-green-800 rounded"></p>

    <div class="bg-white border border-stone-200 rounded-lg shadow overflow-hidden">
      <table class="min-w-full">
        <thead class="bg-amber-900 text-amber-50">
          <tr>
            <th class="text-left py-3 px-4">#</th>
            <th class="text-left py-3 px-4">Nombre</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="cat, i : ${categories}" class="border-t border-stone-200 hover:bg-amber-50/50">
            <td class="py-3 px-4" th:text="${i.count}">1</td>
            <td class="py-3 px-4 font-medium" th:text="${cat}">Categoría</td>
          </tr>
        </tbody>
      </table>
    </div>

    <p th:if="${#lists.isEmpty(categories)}" class="mt-4 text-stone-500">No hay categorías registradas.</p>
  </main>

  <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
