<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menú | MUK</title>


  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" th:href="@{/styles.css}" href="/styles.css" />
</head>

<body class="bg-[#F7F1E8] text-[#34100B]">

  <!-- NAVBAR -->
  <div th:replace="fragments/layout :: navbar-site"></div>

  <main class="pt-24 pb-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-8 lg:px-16">

      <!-- Título -->
      <div class="mb-10">
        <h1 class="text-4xl sm:text-5xl font-black uppercase tracking-tight" style="color:#34100B">
          MENÚ
        </h1>
        <p class="mt-2 text-lg font-bold" style="color:#8C0E03">
          Explora nuestros platos por categoría.
        </p>
      </div>

      <!-- FILTROS (q y category via RequestParam) -->
      <div class="flex flex-col gap-6 mb-10">

        <!-- Buscador (SIN botón buscar, solo input + Enter) -->
        <form th:action="@{/menu}" method="get" class="w-full max-w-2xl">
          <div class="relative">
            <input
              name="q"
              th:value="${searchQuery}"
              placeholder="Buscar platos..."
              class="w-full px-6 py-4 rounded-2xl font-bold text-base sm:text-lg shadow-lg border-4 focus:outline-none"
              style="border-color:#F2B705"
            />
          </div>
          <input type="hidden" name="category" th:value="${selectedCategory}" />
        </form>

        <!-- Pills: más pequeños + WRAP (no scroll horizontal) -->
        <div class="flex flex-wrap gap-3">

          <!-- TODOS -->
          <a th:href="@{/menu}" class="inline-block">
            <span
              class="px-4 py-2 text-xs sm:text-sm font-black rounded-full uppercase tracking-wider transition-all"
              th:style="${selectedCategory}==null ? 'background-color:#34100B;color:#F2B705' : 'background-color:#F2B705;color:#34100B'">
              Todos
            </span>
          </a>

          <!-- Categorías -->
          <a th:each="cat : ${categories}"
             th:href="@{/menu(category=${cat}, q=${searchQuery})}"
             class="inline-block">
            <span
              class="px-4 py-2 text-xs sm:text-sm font-black rounded-full uppercase tracking-wider transition-all"
              th:style="${selectedCategory}==${cat} ? 'background-color:#34100B;color:#F2B705' : 'background-color:#F2B705;color:#34100B'"
              th:text="${cat}">
              Categoría
            </span>
          </a>

        </div>
      </div>

      <!-- GRID DE PLATOS (aquí sí va el each) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">

        <a th:each="dish : ${foods}"
           th:href="@{/comida/{id}(id=${dish.id})}"
           class="group block">

          <!-- CARD -->
          <div class="rounded-[28px] shadow-2xl overflow-hidden transform transition-all group-hover:scale-[1.02]"
               style="background-color:#F2B705">

            <!-- Imagen -->
            <div class="h-52 sm:h-56 relative overflow-hidden">
              <img th:src="${dish.imageUrl}"
                   alt="Plato"
                   class="w-full h-full object-cover transform transition-transform group-hover:scale-110" />

              <div th:if="${dish.category != null && !#strings.isEmpty(dish.category)}"
                   class="absolute top-4 left-4 px-3 py-1.5 text-xs font-black rounded-full text-white"
                   style="background-color:#8C0E03"
                   th:text="${dish.category}">
                Categoría
              </div>
            </div>

            <!-- Contenido (altura fija para que todas las cards sean iguales) -->
            <div class="p-6 flex flex-col" style="min-height: 250px;">

              <!-- Nombre (máx 2 líneas, sin plugin) -->
              <h3 class="text-[#2A0B07] font-black text-3xl leading-tight uppercase"
                  style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden; min-height:72px;"
                  th:text="${dish.name}">
                Nombre
              </h3>

              <!-- Precio -->
              <p class="text-lg sm:text-xl font-black italic mt-2"
                 style="color:#8C0E03">
                $<span th:text="${dish.price != null ? #numbers.formatInteger(dish.price, 0, 'POINT') : '0'}"></span> COP
              </p>

              <!-- Descripción (máx 3 líneas, sin plugin) -->
              <p class="text-[#2A0B07]/80 font-semibold mt-3"
                 style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden; min-height:72px;"
                 th:text="${dish.description}">
                Descripción
              </p>

              <!-- Botón al fondo -->
              <div class="mt-auto pt-6">
                <span class="bg-[#2A0B07] text-white font-black uppercase tracking-widest px-10 py-4 rounded-full inline-block">
                  VER DETALLE
                </span>
              </div>

            </div>
          </div>
        </a>

      </div>

      <!-- Vacío -->
      <div th:if="${#lists.isEmpty(foods)}" class="text-center py-20">
        <p class="text-2xl font-black uppercase" style="color:#34100B">
          No encontramos platos con esos filtros.
        </p>
        <a th:href="@{/menu}" class="inline-block mt-6">
          <span class="px-10 py-4 font-black rounded-full uppercase tracking-widest"
                style="background-color:#34100B;color:#F2B705">
            Ver todo
          </span>
        </a>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <div th:replace="fragments/layout :: footer-site"></div>

  <script th:src="@{/script.js}" src="/script.js"></script>
</body>
</html>
