<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="'Muk. Admin | ' + ${plato.nombre}">Muk. Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background-color:#FAF7F0;">

<div th:replace="fragments/layout :: navbar-admin"></div>

<main class="pt-16 md:pt-20 min-h-screen px-4 sm:px-8 lg:px-16 py-12" style="background-color:#FAF7F0">
  <div class="max-w-6xl mx-auto">

    <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-6 mb-10">
      <div>
        <a th:href="@{/admin/platos}" class="inline-flex items-center gap-2 font-black uppercase tracking-widest text-sm" style="color:#8C0E03"><span>←</span> <span>Volver</span></a>
        <h1 class="mt-3 text-3xl sm:text-4xl font-black uppercase tracking-tighter" style="color:#34100B" th:text="${plato.nombre}">Plato</h1>
        <div class="mt-2 flex flex-wrap gap-2">
          <span class="px-4 py-2 text-xs font-black uppercase tracking-widest rounded-full text-white" style="background-color:#8C0E03" th:text="${plato.categoria != null ? plato.categoria.nombre : ''}">Categoría</span>
          <span class="px-4 py-2 text-xs font-black uppercase tracking-widest rounded-full" th:style="${plato.available} ? 'background-color:#F2B705;color:#34100B' : 'background-color:#D93D04;color:white'" th:text="${plato.available} ? 'Disponible' : 'No disponible'">Disponible</span>
          <span class="px-4 py-2 text-xs font-black uppercase tracking-widest rounded-full" style="background-color:#34100B;color:#F2B705" th:text="'ID: ' + ${plato.id}">ID</span>
        </div>
      </div>

      <div class="flex gap-3">
        <a th:href="@{/admin/platos/{id}/editar(id=${plato.id})}">
          <button class="px-8 py-4 font-black rounded-full uppercase tracking-widest text-white shadow-xl" style="background-color:#F27405">Editar</button>
        </a>
        <form th:action="@{/admin/platos/{id}/eliminar(id=${plato.id})}" method="post" onsubmit="return confirm('¿Eliminar este plato?');">
          <button type="submit" class="px-8 py-4 font-black rounded-full uppercase tracking-widest text-white shadow-xl" style="background-color:#D93D04">Eliminar</button>
        </form>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
      <div class="rounded-3xl overflow-hidden shadow-2xl" style="background-color:#F2B705">
        <div class="h-80 lg:h-[520px]">
          <img th:src="${plato.imagenUrl}" alt="Imagen" class="w-full h-full object-cover" />
        </div>
      </div>

      <div class="rounded-3xl shadow-2xl p-8 sm:p-10" style="background-color:white">
        <div class="text-xs font-black uppercase tracking-widest" style="color:#8C0E03">Precio</div>
        <div class="text-3xl sm:text-4xl font-black italic mt-1" style="color:#8C0E03" th:text="${plato.precio}">$0</div>

        <div class="mt-8 text-xs font-black uppercase tracking-widest" style="color:#8C0E03">Descripción</div>
        <p class="mt-2 font-bold leading-relaxed" style="color:#34100B;opacity:0.85" th:text="${plato.descripcion}">Descripción</p>

        <div class="mt-10">
          <a th:href="@{/comida/{id}(id=${plato.id})}">
            <button class="w-full py-4 font-black rounded-full uppercase tracking-widest text-white transition-all hover:brightness-110" style="background-color:#34100B">Ver en el sitio</button>
          </a>
        </div>
      </div>
    </div>

  </div>
</main>

<script th:src="@{/script.js}" src="/script.js"></script>
</body>
</html>
