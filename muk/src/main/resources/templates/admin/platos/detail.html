<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="'Muk. Admin | ' + ${plato.nombre}">Muk. Admin | Plato</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background-color:#FAF7F0;">

<div th:replace="fragments/layout :: navbar-admin"></div>

<main class="pt-16 md:pt-20 min-h-screen px-4 sm:px-8 lg:px-16 py-12 sm:py-16" style="background-color:#FAF7F0">
  <div class="max-w-6xl mx-auto">

    <a th:href="@{/admin/platos}" class="inline-flex items-center gap-2 font-black uppercase tracking-widest text-sm mb-6" style="color:#8C0E03">
      <span>←</span> <span>Volver al listado</span>
    </a>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-14">
      <div class="rounded-3xl overflow-hidden shadow-2xl" style="background-color:#F2B705">
        <div class="relative h-80 sm:h-[420px] lg:h-[520px]">
          <img th:src="${plato.imagenUrl}" alt="Plato" class="w-full h-full object-cover" />
          <div class="absolute top-6 left-6" th:if="${plato.categoria != null && plato.categoria.nombre != null && !#strings.isEmpty(plato.categoria.nombre)}">
            <span class="px-4 py-2 text-xs font-black rounded-full text-white uppercase tracking-widest" style="background-color:#8C0E03" th:text="${plato.categoria.nombre}">Categoría</span>
          </div>
        </div>
      </div>

      <div class="flex flex-col justify-center">
        <h1 class="text-4xl sm:text-5xl lg:text-6xl font-black uppercase tracking-tighter leading-[0.95]" style="color:#34100B" th:text="${plato.nombre}">Nombre</h1>

        <p class="mt-4 text-xl sm:text-2xl font-black italic" style="color:#8C0E03">
          $<span th:text="${plato.precio != null ? #numbers.formatInteger(plato.precio, 0, 'POINT') : '0'}"></span> COP
        </p>

        <p class="mt-6 text-base sm:text-lg font-bold leading-relaxed" style="color:#34100B;opacity:0.85" th:text="${plato.descripcion}">Descripción</p>

        <div class="mt-8 flex flex-col sm:flex-row gap-4">
          <a th:href="@{/admin/platos/{id}/editar(id=${plato.id})}" class="w-full sm:w-auto">
            <button class="w-full px-10 py-4 font-black rounded-full uppercase tracking-widest transition-all hover:scale-105 active:scale-95 text-white shadow-xl" style="background-color:#D93D04">Editar plato</button>
          </a>
          <form th:action="@{/admin/platos/{id}/eliminar(id=${plato.id})}" method="post" class="w-full sm:w-auto"
                onsubmit="return confirm('¿Eliminar este plato?');">
            <button type="submit" class="w-full px-10 py-4 border-2 font-black rounded-full uppercase tracking-widest transition-all hover:bg-black/5 active:scale-95" style="border-color:#F27405;color:#F27405">Eliminar plato</button>
          </form>
        </div>

        <div class="mt-6">
          <a th:href="@{/comida/{id}(id=${plato.id})}" class="w-full sm:w-auto inline-block">
            <span class="w-full sm:w-auto px-10 py-4 font-black rounded-full uppercase tracking-widest text-white inline-block"
                  style="background-color:#34100B; text-align:center;">
              Ver en el sitio
            </span>
          </a>
        </div>

        <div class="mt-10 grid grid-cols-2 gap-4">
          <div class="rounded-2xl p-5 shadow-lg" style="background-color:white">
            <div class="text-xs font-black uppercase tracking-widest" style="color:#8C0E03">Admin</div>
            <div class="mt-2 font-bold" style="color:#34100B">Puedes editar información o imagen de este plato.</div>
          </div>
          <div class="rounded-2xl p-5 shadow-lg" style="background-color:white">
            <div class="text-xs font-black uppercase tracking-widest" style="color:#8C0E03">Estado</div>
            <div class="mt-2 font-bold" style="color:#34100B" th:text="'ID del plato: ' + ${plato.id}">ID del plato</div>
          </div>
        </div>
      </div>
    </div>

  </div>
</main>

<div th:replace="fragments/layout :: footer-site"></div>

<script th:src="@{/script.js}" src="/script.js"></script>
</body>
</html>
