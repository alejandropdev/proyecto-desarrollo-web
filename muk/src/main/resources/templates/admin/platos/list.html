<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muk. Admin | Platos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background-color:#FAF7F0;">

<div th:replace="fragments/layout :: navbar-admin"></div>

<main class="pt-16 md:pt-20 min-h-screen px-4 sm:px-8 lg:px-16 py-12" style="background-color:#FAF7F0">
  <div class="max-w-7xl mx-auto">

    <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-6 mb-10">
      <div>
        <h1 class="text-3xl sm:text-4xl font-black uppercase tracking-tighter" style="color:#34100B">Administrar platos</h1>
        <p class="font-bold mt-2" style="color:#8C0E03;opacity:0.8">Crear, editar o eliminar platos del menú.</p>
      </div>
      <a th:href="@{/admin/platos/nuevo}">
        <button class="px-8 py-4 font-black rounded-full uppercase tracking-widest text-white shadow-xl transition-all hover:brightness-110" style="background-color:#F27405">+ Nuevo plato</button>
      </a>
    </div>

    <div class="rounded-3xl shadow-2xl overflow-hidden" style="background-color:white">
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead style="background-color:#34100B">
            <tr>
              <th class="text-left px-6 py-4 text-xs font-black uppercase tracking-widest" style="color:#F2B705">ID</th>
              <th class="text-left px-6 py-4 text-xs font-black uppercase tracking-widest" style="color:#F2B705">Nombre</th>
              <th class="text-left px-6 py-4 text-xs font-black uppercase tracking-widest" style="color:#F2B705">Categoría</th>
              <th class="text-left px-6 py-4 text-xs font-black uppercase tracking-widest" style="color:#F2B705">Precio</th>
              <th class="text-right px-6 py-4 text-xs font-black uppercase tracking-widest" style="color:#F2B705">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="p : ${platos}" class="border-t" style="border-color:#F2B70533">
              <td class="px-6 py-4 font-bold" style="color:#34100B" th:text="${p.id}">1</td>
              <td class="px-6 py-4">
                <div class="font-black uppercase" style="color:#34100B" th:text="${p.name}">Nombre</div>
                <div class="text-xs font-bold" style="color:#8C0E03;opacity:0.75" th:text="${p.description}">Descripción</div>
              </td>
              <td class="px-6 py-4 font-bold" style="color:#8C0E03" th:text="${p.category}">Categoria</td>
              <td class="px-6 py-4 font-black" style="color:#8C0E03" th:text="${p.price}">$0</td>
              <td class="px-6 py-4">
                <div class="flex justify-end gap-3">
                  <a th:href="@{/admin/platos/{id}(id=${p.id})}">
                    <button class="px-4 py-2 rounded-full font-black uppercase text-xs" style="background-color:#F2B705;color:#34100B">Ver</button>
                  </a>
                  <a th:href="@{/admin/platos/{id}/editar(id=${p.id})}">
                    <button class="px-4 py-2 rounded-full font-black uppercase text-xs text-white" style="background-color:#F27405">Editar</button>
                  </a>
                  <form th:action="@{/admin/platos/{id}/eliminar(id=${p.id})}" method="post" onsubmit="return confirm('¿Eliminar este plato?');">
                    <button type="submit" class="px-4 py-2 rounded-full font-black uppercase text-xs text-white" style="background-color:#D93D04">Eliminar</button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div th:if="${#lists.isEmpty(platos)}" class="p-10 text-center">
        <p class="text-lg font-black" style="color:#34100B">Aún no hay platos creados.</p>
        <a th:href="@{/admin/platos/nuevo}" class="inline-block mt-5">
          <button class="px-8 py-4 font-black rounded-full uppercase tracking-widest text-white" style="background-color:#F27405">Crear el primero</button>
        </a>
      </div>
    </div>

  </div>
</main>

<script th:src="@{/script.js}" src="/script.js"></script>
</body>
</html>
