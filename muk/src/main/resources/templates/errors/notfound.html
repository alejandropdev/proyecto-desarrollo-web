<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title} ?: 'No encontrado — MUK.'">No encontrado — MUK.</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen flex flex-col">
  <div th:replace="~{fragments/layout :: navbar-site}"></div>

  <main class="flex-1 container mx-auto px-4 pt-28 pb-10">
    <section class="max-w-2xl mx-auto bg-white border border-stone-200 rounded-2xl shadow p-8 text-center">
      <p class="text-xs font-black tracking-widest uppercase text-amber-700 mb-3">Error 404</p>
      <h1 class="text-3xl font-black text-stone-900 mb-4" th:text="${title} ?: 'No encontrado'">No encontrado</h1>
      <p class="text-stone-600 mb-8" th:text="${message} ?: 'El recurso solicitado no fue encontrado.'">
        El recurso solicitado no fue encontrado.
      </p>
      <a th:href="${backUrl} ?: '/'" class="inline-block bg-amber-600 hover:bg-amber-700 text-white font-semibold px-6 py-3 rounded-xl"
         th:text="${backLabel} ?: 'Volver'">
        Volver
      </a>
    </section>
  </main>

  <div th:replace="~{fragments/layout :: footer-site}"></div>
</body>
</html>
