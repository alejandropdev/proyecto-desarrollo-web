server.port=8080
spring.application.name=muk-website

# Serve static content from classpath:static (index.html, etc.)
spring.web.resources.static-locations=classpath:/static/

# Console log format (time, level, logger, message)
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{24} - %msg%n

spring.datasource.url=jdbc:h2:mem:mukdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console